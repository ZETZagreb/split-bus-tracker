<script>
    var map = L.map('map').setView([43.5147, 16.4435], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    var markers = {};
    var stopMarkers = [];
    var activeRoute = null;
    var allRoutesData = null; // Ovdje ćemo spremiti routes.json

    // Učitaj sve rute odmah pri pokretanju
    fetch('/api/routes')
        .then(res => res.json())
        .then(data => { allRoutesData = data; });

    function showLineDetails(lineName) {
        if(activeRoute) map.removeLayer(activeRoute);
        stopMarkers.forEach(m => map.removeLayer(m));
        stopMarkers = [];

        if (!allRoutesData || !lineName) return;

        // Tražimo rutu u bazi prema imenu (npr. "37")
        var route = allRoutesData.find(r => r.name == lineName || r.label == lineName);
        
        if(route && route.stops) {
            var coords = [];
            route.stops.forEach(stop => {
                var pos = [stop.lat, stop.lon];
                coords.push(pos);
                
                var m = L.circleMarker(pos, {
                    radius: 5, fillColor: "#ffcc00", color: "#000", weight: 1, fillOpacity: 1
                }).addTo(map).bindPopup("<b>Stanica:</b> " + stop.name);
                stopMarkers.push(m);
            });

            activeRoute = L.polyline(coords, {
                color: '#007bff', weight: 5, opacity: 0.7
            }).addTo(map);
        }
    }

    function updateBuses() {
        fetch('/api/buses')
            .then(res => res.json())
            .then(data => {
                var buses = data.vehicles || [];
                buses.forEach(bus => {
                    var label = `<div class="bus-badge"><span class="line-text">${bus.name}</span><span class="garage-text">${bus.garageNumber}</span></div>`;
                    var icon = L.divIcon({ html: label, className: '', iconSize: [42, 38] });
                    var popupText = `<b>Linija:</b> ${bus.name}<br><b>Gbr:</b> ${bus.garageNumber}<br><b>Tablice:</b> ${bus.registrationNumber}`;

                    if (markers[bus.id]) {
                        markers[bus.id].setLatLng([bus.latitude, bus.longitude]);
                    } else {
                        markers[bus.id] = L.marker([bus.latitude, bus.longitude], {icon: icon, zIndexOffset: 1000})
                            .addTo(map)
                            .bindPopup(popupText)
                            .on('click', function() { showLineDetails(bus.name); });
                    }
                });
            });
    }

    setInterval(updateBuses, 5000);
    updateBuses();
</script>
