<!DOCTYPE html>
<html>
<head>
    <title>Promet Split Live</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
        
        #search-box {
            position: absolute; top: 15px; left: 55px; z-index: 1000;
            background: white; padding: 8px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #bus-search { border: none; outline: none; padding: 5px 10px; width: 180px; }

        /* --- OVDJE JE SAV DIZAJN IKONA --- */
        .bus-marker {
            /* Osnovni oblik busa - oblina naprijed, ravno straga */
            border-radius: 12px 6px 6px 12px;
            border: 1.5px solid #000; /* Crni rub oko cijelog busa */
            display: flex; flex-direction: column; 
            overflow: hidden; /* Da se boje ne prelijevaju preko ruba */
            box-shadow: 2px 3px 6px rgba(0,0,0,0.4); /* Sjaj */
            transition: transform 0.2s; /* Glatki efekt kad se pomakne */
        }
        .bus-marker:hover { transform: scale(1.1); /* Povećaj kad pređeš mišem */ }

        /* Gornji dio: BIJELO s NARANČASTIM brojevima linije */
        .line-section { 
            background: #ffffff; 
            height: 55%; /* Gornja polovica je malo veća */
            display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid #ccc; /* Tanka crta između boja */
        }
        .line-text { 
            color: #ff7f00; /* TVOJA BOJA: Narančasti brojevi */
            font-size: 14px; font-weight: 800; font-family: 'Arial Black', sans-serif;
            letter-spacing: -1px; /* Malo stisnuti brojevi */
        }

        /* Donji dio: ŽUTO s BIJELIM garažnim brojevima */
        .garage-section { 
            background: #ffcc00; /* TVOJA BOJA: Žuta podloga */
            height: 45%; 
            display: flex; align-items: center; justify-content: center;
        }
        .garage-text { 
            color: #ffffff; /* TVOJA BOJA: Bijeli brojevi */
            font-size: 10px; font-weight: 700; font-family: Arial, sans-serif;
            text-shadow: 0px 1px 2px rgba(0,0,0,0.5); /* Mala sjena ispod bijelih brojeva da se bolje vide */
        }
    </style>
</head>
<body>
    <div id="search-box"><input type="text" id="bus-search" placeholder="Garažni broj..."></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([43.5147, 16.4435], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var markers = {};
        var busData = [];

        function updateBuses() {
            fetch('/api/buses')
                .then(res => res.json())
                .then(data => {
                    busData = data.vehicles || [];
                    busData.forEach(bus => {
                        // Čistimo ime linije (da bude samo broj, npr. 37, a ne Linija 37)
                        var cleanLine = bus.name.toString().replace("Linija ", "").trim();
                        
                        // --- KREIRANJE TVOJE IKONE ---
                        var iconHtml = `<div class="bus-marker">
                                            <div class="line-section">
                                                <span class="line-text">${cleanLine}</span>
                                            </div>
                                            <div class="garage-section">
                                                <span class="garage-text">${bus.garageNumber}</span>
                                            </div>
                                        </div>`;
                        
                        var icon = L.divIcon({ 
                            html: iconHtml, 
                            className: '', 
                            iconSize: [42, 36], // Malo veće da stane tekst
                            iconAnchor: [21, 36] // Sidro na dnu-sredini
                        });

                        var popupText = `<b>Linija:</b> ${bus.name}<br><b>Gbr:</b> ${bus.garageNumber}<br><b>Reg:</b> ${bus.registrationNumber}`;

                        if (markers[bus.id]) {
                            markers[bus.id].setLatLng([bus.latitude, bus.longitude]);
                            markers[bus.id].getPopup().setContent(popupText);
                        } else {
                            markers[bus.id] = L.marker([bus.latitude, bus.longitude], {
                                icon: icon, 
                                zIndexOffset: 1000 
                            }).addTo(map).bindPopup(popupText);
                        }
                    });
                });
        }

        setInterval(updateBuses, 5000);
        updateBuses();
    </script>
</body>
</html>
