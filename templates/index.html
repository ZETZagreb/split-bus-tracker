<!DOCTYPE html>
<html>
<head>
    <title>Promet Split Live</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Postavljanje karte na Split
        var map = L.map('map').setView([43.5147, 16.4435], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var markers = {};

        function updateBuses() {
            fetch('/api/buses')
                .then(res => res.json())
                .then(data => {
                    data.forEach(bus => {
                        // API podaci
                        let lat = bus.lat;
                        let lon = bus.lon;
                        let linija = bus.line_name || "---";
                        let smjer = bus.destination || "Nepoznato";
                        let garazni = bus.device_number || bus.id;

                        if (lat && lon) {
                            let popupContent = `
                                <b>Linija:</b> ${linija}<br>
                                <b>Smjer:</b> ${smjer}<br>
                                <b>Garažni broj:</b> ${garazni}
                            `;

                            if (markers[bus.id]) {
                                // Ako marker već postoji, samo ga pomakni
                                markers[bus.id].setLatLng([lat, lon]);
                                markers[bus.id].setPopupContent(popupContent);
                            } else {
                                // Ako ne postoji, stvori novi
                                markers[bus.id] = L.marker([lat, lon])
                                    .addTo(map)
                                    .bindPopup(popupContent);
                            }
                        }
                    });
                })
                .catch(err => console.error("Greška pri dohvaćanju:", err));
        }

        // Osvježavaj svakih 5 sekundi
        setInterval(updateBuses, 5000);
        updateBuses();
    </script>
</body>
</html>
