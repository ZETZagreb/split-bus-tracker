<!DOCTYPE html>
<html>
<head>
    <title>Promet Split Live Tracker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #search-box { position: absolute; top: 15px; left: 55px; z-index: 1000; background: white; padding: 8px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #bus-search { border: none; outline: none; padding: 5px; width: 150px; font-weight: bold; }
        .bus-marker { border-radius: 4px; border: 1.5px solid #222; display: flex; flex-direction: column; overflow: hidden; box-shadow: 2px 4px 6px rgba(0,0,0,0.4); background: #fff; }
        .line-section { background: #ffffff; height: 38%; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #ddd; }
        .line-text { color: #ff7f00; font-size: 10px; font-weight: 800; }
        .garage-section { background: #ffcc00; height: 62%; display: flex; align-items: center; justify-content: center; }
        .garage-text { color: #ffffff; font-size: 14px; font-weight: 900; text-shadow: 1px 1px 2px rgba(0,0,0,0.7); }
    </style>
</head>
<body>
    <div id="search-box"><input type="text" id="bus-search" placeholder="Garažni broj..."></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([43.5147, 16.4435], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var markers = {};
        var stopMarkers = [];
        var activeRoute = null;

        // FUNKCIJA KOJA SLOŽI SVE LINIJE AUTOMATSKI
        function drawAnyRoute(lineId) {
            if(activeRoute) map.removeLayer(activeRoute);
            stopMarkers.forEach(m => map.removeLayer(m));
            stopMarkers = [];

            // Pitamo naš server za stanice te linije
            fetch(`/api/route_details/${lineId}`)
                .then(res => res.json())
                .then(data => {
                    if(data.stops && data.stops.length > 0) {
                        var coords = [];
                        data.stops.forEach(s => {
                            coords.push([s.lat, s.lon]);
                            var sm = L.circleMarker([s.lat, s.lon], { radius: 6, fillColor: "#ffcc00", color: "#000", weight: 2, fillOpacity: 1 })
                                     .addTo(map).bindPopup(`<b>Stanica:</b> ${s.name}`);
                            stopMarkers.push(sm);
                        });
                        activeRoute = L.polyline(coords, {color: '#007bff', weight: 6, opacity: 0.8}).addTo(map);
                    }
                });
        }

        function updateBuses() {
            fetch('/api/buses').then(res => res.json()).then(data => {
                (data.vehicles || []).forEach(bus => {
                    var lineNum = bus.name.replace(/\D/g, "");
                    var iconHtml = `<div class="bus-marker">
                        <div class="line-section"><span class="line-text">${lineNum}</span></div>
                        <div class="garage-section"><span class="garage-text">${bus.garageNumber}</span></div>
                    </div>`;
                    var icon = L.divIcon({ html: iconHtml, className: '', iconSize: [45, 35], iconAnchor: [22, 17] });
                    
                    var popup = `<b>Linija ${bus.name}</b><br><hr>
                                 <b>Smjer:</b> ${bus.origin || 'Učitavanje...'} ➔ ${bus.destination || 'Učitavanje...'}<br>
                                 <b>Krenuo u:</b> ${bus.departureTime || 'Nepoznato'}<br>
                                 <b>Gbr:</b> ${bus.garageNumber}<br>
                                 <b>Reg:</b> ${bus.registrationNumber}`;

                    if (markers[bus.id]) {
                        markers[bus.id].setLatLng([bus.latitude, bus.longitude]).setPopupContent(popup);
                    } else {
                        // Koristimo bus.lineId (ili slično) da dohvatimo trasu
                        markers[bus.id] = L.marker([bus.latitude, bus.longitude], {icon: icon})
                            .addTo(map).bindPopup(popup).on('click', () => drawAnyRoute(bus.lineId || lineNum));
                    }
                });
            });
        }

        setInterval(updateBuses, 5000);
        updateBuses();
    </script>
</body>
</html>
