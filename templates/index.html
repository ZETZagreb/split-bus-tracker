<!DOCTYPE html>
<html>
<head>
    <title>Promet Split - Arhiva i Live</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        
        /* Dizajn žutih cigli */
        .bus-marker { border-radius: 4px; border: 1.5px solid #222; display: flex; flex-direction: column; overflow: hidden; background: #fff; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .line-section { background: #ffffff; height: 40%; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #ddd; }
        .line-text { color: #ff7f00; font-size: 11px; font-weight: 900; }
        .garage-section { background: #ffcc00; height: 60%; display: flex; align-items: center; justify-content: center; }
        .garage-text { color: #ffffff; font-size: 14px; font-weight: 900; text-shadow: 1px 1px 1px rgba(0,0,0,0.5); }
        
        .hist-box { max-height: 120px; overflow-y: auto; font-size: 11px; margin-top: 8px; border-top: 1px solid #eee; padding-top: 5px; }
        .hist-item { padding: 2px 0; border-bottom: 1px solid #f9f9f9; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([43.5147, 16.4435], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var markers = {};

        function viewHistory(gbr) {
            fetch(`/api/history/${gbr}`)
                .then(res => res.json())
                .then(data => {
                    let html = "<b>Povijest linija danas:</b><br>";
                    data.forEach(h => {
                        html += `<div class="hist-item">🕒 ${h.time} - <b>Linija ${h.line}</b></div>`;
                    });
                    document.getElementById('hist-content-' + gbr).innerHTML = html;
                });
        }

        function updateBuses() {
            fetch('/api/buses').then(res => res.json()).then(data => {
                (data.vehicles || []).forEach(bus => {
                    var lineNum = bus.name.toString().replace(/\D/g, "");
                    var gbr = bus.garageNumber;
                    
                    var iconHtml = `
                        <div class="bus-marker">
                            <div class="line-section"><span class="line-text">${lineNum}</span></div>
                            <div class="garage-section"><span class="garage-text">${gbr}</span></div>
                        </div>`;
                    
                    var icon = L.divIcon({ html: iconHtml, className: '', iconSize: [45, 35], iconAnchor: [22, 17] });

                    var popupContent = `
                        <div style="min-width: 160px;">
                            <b style="font-size: 15px;">Linija ${lineNum}</b><br>
                            <b>Gbr:</b> ${gbr}<br>
                            <b>Reg:</b> ${bus.registrationNumber}<br>
                            <button onclick="viewHistory('${gbr}')" style="margin-top:8px; width:100%; cursor:pointer;">Prikaži kretanje</button>
                            <div class="hist-box" id="hist-content-${gbr}">Klikni za učitavanje povijesti...</div>
                        </div>`;

                    if (markers[bus.id]) {
                        markers[bus.id].setLatLng([bus.latitude, bus.longitude]).setPopupContent(popupContent);
                    } else {
                        markers[bus.id] = L.marker([bus.latitude, bus.longitude], {icon: icon})
                            .addTo(map).bindPopup(popupContent);
                    }
                });
            });
        }

        setInterval(updateBuses, 5000);
        updateBuses();
    </script>
</body>
</html>
