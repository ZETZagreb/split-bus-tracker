<!DOCTYPE html>
<html>
<head>
    <title>Promet Split Live</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([43.5147, 16.4435], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var markers = {};

        function updateBuses() {
            fetch('/api/buses')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    data.forEach(function(bus) {
                        var lat = bus.lat;
                        var lon = bus.lon;
                        
                        // Izvlačenje podataka
                        var linija = bus.line_name || "---";
                        var smjer = bus.destination || "Nepoznato";
                        var garazni = bus.device_number || bus.id;

                        // Slanje teksta u popup (klasičan način bez backtickova)
                        var popupText = "<b>Linija:</b> " + linija + "<br>" +
                                        "<b>Smjer:</b> " + smjer + "<br>" +
                                        "<b>Garažni broj:</b> " + garazni;

                        if (lat && lon) {
                            if (markers[bus.id]) {
                                markers[bus.id].setLatLng([lat, lon]);
                                markers[bus.id].setPopupContent(popupText);
                            } else {
                                markers[bus.id] = L.marker([lat, lon])
                                    .addTo(map)
                                    .bindPopup(popupText);
                            }
                        }
                    });
                });
        }

        setInterval(updateBuses, 5000);
        updateBuses();
    </script>
</body>
</html>
