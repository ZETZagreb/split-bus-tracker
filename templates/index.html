<!DOCTYPE html>
<html>
<head>
    <title>Promet Split Arhiva</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        .bus-label { background: white; border: 2px solid orange; font-weight: bold; text-align: center; border-radius: 3px; padding: 1px 3px; }
        .search-box { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="search-box">
        <input type="text" id="gbrSearch" placeholder="Garažni broj...">
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([43.5147, 16.4435], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var markers = {};

        function updateBuses() {
            fetch('/api/buses')
                .then(res => res.json())
                .then(data => {
                    data.vehicles.forEach(bus => {
                        var gbr = bus.garageNumber;
                        var lat = bus.latitude;
                        var lon = bus.longitude;
                        var line = bus.name || "N/A";
                        var reg = bus.registrationNumber || "N/A";
                        var dir = bus.destinationName || "Nepoznato";
                        var sch = bus.scheduledDeparture || "---";

                        var popupContent = `
                            <b>Gbr: ${gbr}</b><br>
                            Reg: ${reg}<br>
                            Linija: ${line}<br>
                            Smjer: ${dir}<br>
                            Polazak: ${sch}
                        `;

                        if (markers[gbr]) {
                            markers[gbr].setLatLng([lat, lon]).setPopupContent(popupContent);
                        } else {
                            var icon = L.divIcon({
                                className: 'bus-label',
                                html: `<div>${line.replace('Linija ','')}</div><div style="color:orange">${gbr}</div>`,
                                iconSize: [40, 30]
                            });
                            markers[gbr] = L.marker([lat, lon], {icon: icon}).addTo(map).bindPopup(popupContent);
                        }
                    });
                });
        }

        setInterval(updateBuses, 10000);
        updateBuses();
    </script>
</body>
</html>
