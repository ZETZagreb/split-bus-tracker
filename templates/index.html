<!DOCTYPE html>
<html>
<head>
    <title>Split Transit History & Live</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #top-bar { background: #0055a4; padding: 10px; display: flex; gap: 10px; z-index: 1001; color: white; align-items: center; }
        #gbrSearch { flex-grow: 1; padding: 10px 20px; border-radius: 25px; border: none; font-size: 14px; }
        #map { flex-grow: 1; width: 100%; }
        #panel { height: 35%; overflow-y: auto; background: white; border-top: 3px solid #222; }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f4f4f4; padding: 12px; border-bottom: 2px solid #ccc; position: sticky; top: 0; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .gbr-label { background: #222; color: #ffc107; padding: 3px 6px; border-radius: 4px; font-weight: bold; font-family: monospace; }
        .history-tag { display: inline-block; background: #e3f2fd; border: 1px solid #2196f3; color: #0d47a1; padding: 2px 6px; border-radius: 4px; margin: 2px; font-size: 11px; }

        .split-icon { width: 42px !important; height: 42px !important; border-radius: 50%; border: 2px solid #333; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
        .icon-top { background: white; height: 50%; display: flex; align-items: center; justify-content: center; color: #ff6f00; font-weight: bold; font-size: 14px; border-bottom: 1px solid #333; }
        .icon-bottom { background: #ffeb3b; height: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 11px; text-shadow: 1px 1px 1px rgba(0,0,0,0.6); }
    </style>
</head>
<body>

<div id="top-bar">
    <input type="date" id="datePicker" style="padding: 5px; border-radius: 5px; border: none;">
    <input type="text" id="gbrSearch" placeholder="🔍 Pretraži GBR ili povijest..." onkeyup="filterTable()">
</div>

<div id="map"></div>

<div id="panel">
    <table>
        <thead>
            <tr>
                <th>GBR</th>
                <th>Vozilo</th>
                <th>Linija i Smjer</th>
                <th>Dnevnik kretanja (Danas)</th>
            </tr>
        </thead>
        <tbody id="busBody"></tbody>
    </table>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([43.5147, 16.4435], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    var busMarkers = {};
    var stopLayer = L.layerGroup();
    var historyData = {}; // Objekt za čuvanje kretanja tijekom dana
    L.control.layers(null, { "Prikaži stanice": stopLayer }).addTo(map);

    // Postavi današnji datum u picker
    document.getElementById('datePicker').valueAsDate = new Date();

    function update() {
        fetch('/api/vehicles').then(r => r.json()).then(data => {
            let vehicles = data.data || data;
            let html = "";
            let now = new Date().toLocaleTimeString('hr-HR', {hour: '2-digit', minute:'2-digit'});

            vehicles.forEach(bus => {
                let id = bus.deviceId || bus.id;
                let gbr = bus.vehicleNumber || bus.label || "???";
                let marka = bus.model || "Autobus";
                if (gbr == "318") marka = marka.replace("Tomo", "").trim();

                let linija = bus.lineCode || "???";
                let smjer = bus.destination || "U prometu";
                let lat = bus.latitude;
                let lon = bus.longitude;

                if (lat && lon) {
                    // Bilježenje u povijest ako se linija ili smjer promijene
                    if (!historyData[gbr]) {
                        historyData[gbr] = [];
                    }
                    let lastEntry = historyData[gbr][historyData[gbr].length - 1];
                    let currentEntry = `${now} | L${linija} -> ${smjer}`;
                    
                    if (!lastEntry || lastEntry.split('|')[1].trim() !== `L${linija} -> ${smjer}`) {
                        historyData[gbr].push(currentEntry);
                    }

                    // Ikona
                    let iconHtml = `<div class="split-icon"><div class="icon-top">${linija}</div><div class="icon-bottom">${gbr}</div></div>`;
                    let customIcon = L.divIcon({ className: '', html: iconHtml, iconSize: [42, 42], iconAnchor: [21, 21] });

                    if (busMarkers[id]) {
                        busMarkers[id].setLatLng([lat, lon]).setIcon(customIcon);
                    } else {
                        busMarkers[id] = L.marker([lat, lon], {icon: customIcon}).addTo(map);
                    }

                    html += `<tr onclick="map.setView([${lat}, ${lon}], 17)">
                        <td><span class="gbr-label">${gbr}</span></td>
                        <td>${marka}</td>
                        <td style="color:#d32f2f; font-weight:bold">${linija} ${smjer}</td>
                        <td>${historyData[gbr].map(h => `<span class="history-tag">${h}</span>`).join("")}</td>
                    </tr>`;
                }
            });
            document.getElementById("busBody").innerHTML = html;
        });
    }

    function filterTable() {
        let val = document.getElementById("gbrSearch").value.toLowerCase();
        let rows = document.querySelectorAll("#busBody tr");
        rows.forEach(r => r.style.display = r.innerText.toLowerCase().includes(val) ? "" : "none");
    }

    setInterval(update, 10000);
    update();
</script>
</body>
</html>
