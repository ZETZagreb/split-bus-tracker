<!DOCTYPE html>
<html>
<head>
    <title>Split Bus Live</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .bus-label {
            width: 45px; height: 40px; border: 2px solid #333; border-radius: 6px;
            overflow: hidden; display: flex; flex-direction: column; font-family: Arial;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([43.5081, 16.4402], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    var markers = {};

    function updateBuses() {
        fetch('/api/buses/split')
            .then(res => res.json())
            .then(data => {
                if(!data.vehicles) return;
                var currentGbrs = data.vehicles.map(v => v.garageNumber);
                
                data.vehicles.forEach(bus => {
                    var html = `
                        <div class="bus-label">
                            <div style="background:white; color:#0054a6; height:20px; line-height:20px; font-weight:bold; text-align:center; font-size:13px;">${bus.name}</div>
                            <div style="background:#0054a6; color:white; height:20px; line-height:20px; font-weight:bold; text-align:center; font-size:11px;">${bus.garageNumber}</div>
                        </div>`;
                    
                    var icon = L.divIcon({ html: html, className: '', iconSize: [45, 40], iconAnchor: [22, 20] });
                    
                    if (markers[bus.garageNumber]) {
                        markers[bus.garageNumber].setLatLng([bus.latitude, bus.longitude]);
                    } else {
                        markers[bus.garageNumber] = L.marker([bus.latitude, bus.longitude], {icon: icon}).addTo(map);
                    }
                    
                    // Ovdje se prikazuje točan polazak i smjer povučen iz API-ja
                    markers[bus.garageNumber].bindPopup(`
                        <b style="color:#0054a6; font-size:15px;">Linija ${bus.name}</b><br>
                        <b style="font-size:13px;">Smjer: ${bus.destination}</b><hr>
                        Garažni broj: ${bus.garageNumber}<br>
                        Brzina: ${bus.speed} km/h
                    `);
                });

                // Brišemo markere autobusa koji više nisu na liniji
                for (var gbr in markers) {
                    if (!currentGbrs.includes(gbr)) {
                        map.removeLayer(markers[gbr]);
                        delete markers[gbr];
                    }
                }
            });
    }

    setInterval(updateBuses, 5000);
    updateBuses();
</script>
</body>
</html>
