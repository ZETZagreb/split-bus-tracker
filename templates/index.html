<!DOCTYPE html>
<html>
<head>
    <title>Promet Split Live</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        .bus-badge {
            background: #ffcc00;
            border: 2px solid #000;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
            text-align: center;
            font-size: 12px;
            padding: 2px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([43.5147, 16.4435], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var markers = {};

        function updateBuses() {
            // KORISTIMO PROXY TUNEL DA ZAOBIĐEMO BLOKADU
            const proxy = "https://corsproxy.io/?";
            const url = "https://najava.promet-split.hr/api/get-all-vehicles";

            fetch(proxy + encodeURIComponent(url))
                .then(res => res.json())
                .then(data => {
                    const vehicles = data.vehicles || [];
                    vehicles.forEach(bus => {
                        if (bus.latitude && bus.longitude) {
                            const pos = [bus.latitude, bus.longitude];
                            const label = `<div class="bus-badge">${bus.name}<br>${bus.garageNumber}</div>`;
                            const icon = L.divIcon({ html: label, className: '', iconSize: [40, 35] });

                            if (markers[bus.id]) {
                                markers[bus.id].setLatLng(pos);
                            } else {
                                markers[bus.id] = L.marker(pos, {icon: icon}).addTo(map)
                                    .bindPopup(`Linija: ${bus.name}<br>Reg: ${bus.registrationNumber}`);
                            }
                        }
                    });
                })
                .catch(err => console.log("Greška pri dohvaćanju..."));
        }

        setInterval(updateBuses, 5000);
        updateBuses();
    </script>
</body>
</html>
