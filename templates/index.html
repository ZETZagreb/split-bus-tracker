<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Promet Split Live</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #0055a4; padding: 10px; z-index: 1000; }
        #search { width: 100%; max-width: 400px; padding: 8px; border-radius: 20px; border: none; display: block; margin: 0 auto; }
        #map { flex-grow: 1; }
        #list { height: 35%; overflow-y: auto; background: white; border-top: 2px solid #222; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        .gbr { background: #222; color: #ffc107; padding: 2px 5px; border-radius: 3px; font-weight: bold; }
        .bus-icon { width: 40px!important; height: 40px!important; border-radius: 50%; border: 2px solid #333; display: flex; flex-direction: column; overflow: hidden; }
        .i-top { background: white; height: 50%; display: flex; align-items: center; justify-content: center; color: #ff6f00; font-weight: bold; }
        .i-bot { background: #ffeb3b; height: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="header"><input type="text" id="search" placeholder="Pretraži..." onkeyup="filter()"></div>
<div id="map"></div>
<div id="list">
    <table>
        <thead><tr><th>GBR</th><th>Linija</th><th>Odredište</th></tr></thead>
        <tbody id="busBody"></tbody>
    </table>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([43.5147, 16.4435], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    var markers = {};

    function update() {
        fetch('/api/vehicles').then(r => r.json()).then(data => {
            if (!Array.isArray(data)) return;
            let html = "";
            data.forEach(bus => {
                let id = bus.deviceId || bus.id;
                let gbr = bus.vehicleNumber || bus.label || "???";
                let line = bus.lineCode || "---";
                let lat = bus.latitude, lon = bus.longitude;

                if (lat && lon) {
                    let iconHtml = `<div class="bus-icon"><div class="i-top">${line}</div><div class="i-bot">${gbr}</div></div>`;
                    let icon = L.divIcon({ html: iconHtml, iconSize: [40, 40], iconAnchor: [20, 20], className: '' });

                    if (markers[id]) {
                        markers[id].setLatLng([lat, lon]).setIcon(icon);
                    } else {
                        markers[id] = L.marker([lat, lon], {icon: icon}).addTo(map);
                    }
                    html += `<tr onclick="map.setView([${lat}, ${lon}], 16)"><td><span class="gbr">${gbr}</span></td><td>${line}</td><td>${bus.destination || ''}</td></tr>`;
                }
            });
            document.getElementById("busBody").innerHTML = html;
        });
    }

    function filter() {
        let v = document.getElementById("search").value.toLowerCase();
        document.querySelectorAll("#busBody tr").forEach(r => r.style.display = r.innerText.toLowerCase().includes(v) ? "" : "none");
    }

    setInterval(update, 10000);
    update();
</script>
</body>
</html>
