<!DOCTYPE html>
<html>
<head>
    <title>Promet Split Live</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        .search-container {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            background: white; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input { padding: 5px; width: 150px; }
        .bus-label {
            background: white; border: 1px solid black; border-radius: 3px;
            padding: 2px; font-weight: bold; text-align: center; font-size: 10px;
        }
    </style>
</head>
<body>

<div class="search-container">
    <input type="text" id="busSearch" placeholder="Traži Gbr ili Liniju..." onkeyup="filterBuses()">
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([43.5147, 16.4435], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    var markers = {};

    function updateBuses() {
        fetch('/api/buses')
            .then(response => response.json())
            .then(data => {
                var currentGbrs = data.vehicles.map(v => v.garageNumber);
                
                data.vehicles.forEach(bus => {
                    var labelContent = `<div class="bus-label">${bus.name}<br>${bus.garageNumber}</div>`;
                    var icon = L.divIcon({ html: labelContent, className: '', iconSize: [35, 35] });

                    if (markers[bus.garageNumber]) {
                        markers[bus.garageNumber].setLatLng([bus.latitude, bus.longitude]);
                    } else {
                        markers[bus.garageNumber] = L.marker([bus.latitude, bus.longitude], {icon: icon}).addTo(map);
                    }

                    // POPUP SA SAMO 4 TRAŽENA PODATKA
                    markers[bus.garageNumber].bindPopup(`
                        <b>Gbr: ${bus.garageNumber}</b><br>
                        <b>Linija: ${bus.name}</b><br>
                        Reg: ${bus.registrationNumber}<br>
                        Marka: ${bus.brand}
                    `);
                });

                for (var gbr in markers) {
                    if (!currentGbrs.includes(gbr)) {
                        map.removeLayer(markers[gbr]);
                        delete markers[gbr];
                    }
                }
            });
    }

    function filterBuses() {
        var val = document.getElementById('busSearch').value.toLowerCase();
        for (var gbr in markers) {
            var marker = markers[gbr];
            var popupContent = marker.getPopup().getContent().toLowerCase();
            if (popupContent.includes(val)) {
                marker.setOpacity(1);
            } else {
                marker.setOpacity(0.1);
            }
        }
    }

    setInterval(updateBuses, 5000);
    updateBuses();
</script>
</body>
</html>
