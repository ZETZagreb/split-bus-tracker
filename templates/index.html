<!DOCTYPE html>
<html>
<head>
    <title>Split Bus Live</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
        .bus-badge {
            background: #ffcc00;
            border: 2px solid #000;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
            text-align: center;
            font-family: sans-serif;
            padding: 2px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([43.5147, 16.4435], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var markers = {};

        function updateBuses() {
            // SADA DIREKTNO GAĐAMO PROMET SPLIT IZ TVOG PREGLEDNIKA
            fetch('https://najava.promet-split.hr/api/get-all-vehicles')
                .then(res => res.json())
                .then(data => {
                    var list = data.vehicles || [];
                    list.forEach(bus => {
                        if (bus.latitude && bus.longitude) {
                            var pos = [bus.latitude, bus.longitude];
                            var label = `<div class="bus-badge">${bus.name}<br><small>${bus.garageNumber}</small></div>`;
                            var icon = L.divIcon({ html: label, className: '', iconSize: [40, 35] });

                            if (markers[bus.id]) {
                                markers[bus.id].setLatLng(pos);
                            } else {
                                markers[bus.id] = L.marker(pos, {icon: icon}).addTo(map);
                            }
                        }
                    });
                })
                .catch(err => console.log("Čekamo podatke..."));
        }

        setInterval(updateBuses, 5000);
        updateBuses();
    </script>
</body>
</html>
