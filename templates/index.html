<!DOCTYPE html>
<html>
<head>
    <title>Promet Split Live</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #search-box {
            position: absolute; top: 15px; left: 55px; z-index: 1000;
            background: white; padding: 8px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #bus-search { border: none; outline: none; padding: 5px 10px; width: 200px; }

        .bus-badge {
            border: 2px solid #333; border-radius: 6px;
            text-align: center; font-weight: bold;
            display: flex; flex-direction: column; overflow: hidden;
            background: white; box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        .line-text { background: #ffffff; color: black; font-size: 14px; padding: 2px 0; border-bottom: 1px solid #ccc; }
        .garage-text { background: #ffcc00; color: black; font-size: 10px; padding: 2px 0; }
    </style>
</head>
<body>
    <div id="search-box">
        <input type="text" id="bus-search" placeholder="Traži garažni broj...">
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([43.5147, 16.4435], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var markers = {};
        var stopMarkers = [];
        var allBuses = [];
        var activeRoute = null;

        function showLineDetails(lineId, busLat, busLon) {
            // Čistimo staro
            if(activeRoute) map.removeLayer(activeRoute);
            stopMarkers.forEach(m => map.removeLayer(m));
            stopMarkers = [];

            // 1. Crtamo putanju po cestama (OSRM)
            var start = [43.5147, 16.4435]; // Centar/Sukoišanska
            fetch(`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${busLon},${busLat}?overview=full&geometries=geojson`)
                .then(res => res.json())
                .then(data => {
                    if(data.routes) {
                        var coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                        activeRoute = L.polyline(coords, {color: '#007bff', weight: 6, opacity: 0.5}).addTo(map);
                    }
                });

            // 2. Dohvaćamo stanice s tvog novog API-ja
            fetch(`/api/stops/${lineId}`)
                .then(res => res.json())
                .then(stops => {
                    if(Array.isArray(stops)) {
                        stops.forEach(stop => {
                            var m = L.circleMarker([stop.lat, stop.lon], {
                                radius: 5, fillColor: "#ffcc00", color: "#000", weight: 1, fillOpacity: 1
                            }).addTo(map).bindPopup("<b>Stanica:</b> " + stop.name);
                            stopMarkers.push(m);
                        });
                    }
                });
        }

        function updateBuses() {
            fetch('/api/buses')
                .then(res => res.json())
                .then(data => {
                    allBuses = data.vehicles || [];
                    allBuses.forEach(bus => {
                        if (bus.latitude && bus.longitude) {
                            var label = `<div class="bus-badge">
                                            <span class="line-text">${bus.name || '?'}</span>
                                            <span class="garage-text">${bus.garageNumber || ''}</span>
                                         </div>`;
                            var icon = L.divIcon({ html: label, className: '', iconSize: [42, 38] });

                            if (markers[bus.id]) {
                                markers[bus.id].setLatLng([bus.latitude, bus.longitude]);
                                markers[bus.id].setIcon(icon);
                            } else {
                                markers[bus.id] = L.marker([bus.latitude, bus.longitude], {icon: icon}).addTo(map)
                                    .on('click', function() { showLineDetails(bus.lineId, bus.latitude, bus.longitude); });
                            }
                        }
                    });
                });
        }

        map.on('click', function(e) {
            if (!e.originalEvent.target.classList.contains('leaflet-marker-icon')) {
                if(activeRoute) map.removeLayer(activeRoute);
                stopMarkers.forEach(m => map.removeLayer(m));
                activeRoute = null;
            }
        });

        document.getElementById('bus-search').addEventListener('input', function(e) {
            var val = e.target.value.trim().toLowerCase();
            if(!val) return;
            var found = allBuses.find(b => b.garageNumber && b.garageNumber.toString().toLowerCase().includes(val));
            if(found && markers[found.id]) {
                map.setView([found.latitude, found.longitude], 17);
                showLineDetails(found.lineId, found.latitude, found.longitude);
            }
        });

        setInterval(updateBuses, 5000);
        updateBuses();
    </script>
</body>
</html>
