<!DOCTYPE html>
<html>
<head>
    <title>Promet Split Live</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* --- STIL ZA TRAŽILICU --- */
        #search-box {
            position: absolute;
            top: 15px;
            left: 55px; /* Da ne prekrije gumbe za zoom */
            z-index: 1000;
            background: white;
            padding: 8px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
        }
        #bus-search {
            border: none;
            outline: none;
            padding: 5px 10px;
            width: 180px;
            font-size: 14px;
        }

        /* --- STIL ZA NALJEPNICU AUTOBUSA (IKONA) --- */
        .bus-badge {
            background: #ffcc00; /* Prepoznatljiva žuta boja */
            border: 2px solid #333;
            border-radius: 6px;
            color: black;
            font-weight: bold;
            text-align: center;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }
        .line-text {
            font-size: 14px;
            line-height: 1.1;
            padding-top: 2px;
        }
        .garage-text {
            font-size: 9px;
            background: rgba(0,0,0,0.05);
            margin-top: 1px;
            padding-bottom: 1px;
            color: #444;
        }
    </style>
</head>
<body>

    <div id="search-box">
        <input type="text" id="bus-search" placeholder="Traži liniju (npr. 37)...">
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([43.5147, 16.4435], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var markers = {};
        var allBuses = [];

        function updateBuses() {
            fetch('/api/buses')
                .then(res => res.json())
                .then(data => {
                    allBuses = data.vehicles || [];
                    
                    allBuses.forEach(bus => {
                        var lat = bus.latitude;
                        var lon = bus.longitude;
                        
                        if (lat && lon) {
                            var linija = bus.name || "?";
                            var garazni = bus.garageNumber || "";
                            var reg = bus.registrationNumber || "";

                            // Kreiramo HTML za našu novu ikonu
                            var iconHtml = '<div class="bus-badge">' +
                                           '<span class="line-text">' + linija + '</span>' +
                                           '<span class="garage-text">' + garazni + '</span>' +
                                           '</div>';

                            var customIcon = L.divIcon({
                                html: iconHtml,
                                className: '', // Resetiramo defaultne stilove
                                iconSize: [42, 36],
                                iconAnchor: [21, 18]
                            });

                            var popupContent = "<b>Linija:</b> " + linija + "<br>" +
                                               "<b>Garažni broj:</b> " + garazni + "<br>" +
                                               "<b>Registracija:</b> " + reg;

                            if (markers[bus.id]) {
                                markers[bus.id].setLatLng([lat, lon]);
                                markers[bus.id].setIcon(customIcon);
                                markers[bus.id].getPopup().setContent(popupContent);
                            } else {
                                markers[bus.id] = L.marker([lat, lon], {icon: customIcon})
                                    .addTo(map)
                                    .bindPopup(popupContent);
                            }
                        }
                    });
                });
        }

        // --- LOGIKA TRAŽILICE ---
        document.getElementById('bus-search').addEventListener('input', function(e) {
            var searchVal = e.target.value.trim().toLowerCase();
            if (searchVal === "") return;

            // Tražimo bus koji odgovara upisanoj liniji
            var found = allBuses.find(b => b.name && b.name.toLowerCase() === searchVal);
            
            // Ako ne nađemo točno, tražimo bilo koji koji sadrži taj broj
            if (!found) {
                found = allBuses.find(b => b.name && b.name.toLowerCase().includes(searchVal));
            }

            if (found && markers[found.id]) {
                map.setView([found.latitude, found.longitude], 16);
                markers[found.id].openPopup();
            }
        });

        // Osvježavanje svakih 5 sekundi
        setInterval(updateBuses, 5000);
        updateBuses();
    </script>
</body>
</html>
