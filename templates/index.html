<!DOCTYPE html>
<html>
<head>
    <title>Promet Split Arhiva</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        .bus-label { 
            background: white; border: 2px solid #ff8c00; font-weight: bold; 
            text-align: center; border-radius: 4px; padding: 2px; color: #333;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2); font-size: 11px; min-width: 35px;
        }
        .gbr-label { color: #ff8c00; font-size: 10px; border-top: 1px solid #eee; margin-top: 1px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([43.5147, 16.4435], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var markers = {};

        function updateBuses() {
            fetch('/api/buses')
                .then(res => res.json())
                .then(data => {
                    data.vehicles.forEach(bus => {
                        var content = `<b>Gbr: ${bus.garageNumber}</b><br>Linija: ${bus.name}<br>Smjer: ${bus.destinationName}<br>Polazak: ${bus.scheduledDeparture}<br>Reg: ${bus.registrationNumber}`;
                        if (markers[bus.garageNumber]) {
                            markers[bus.garageNumber].setLatLng([bus.latitude, bus.longitude]).setPopupContent(content);
                        } else {
                            var icon = L.divIcon({
                                className: 'bus-label',
                                html: `<div>${bus.name}</div><div class="gbr-label">${bus.garageNumber}</div>`,
                                iconSize: [45, 35]
                            });
                            markers[bus.garageNumber] = L.marker([bus.latitude, bus.longitude], {icon: icon}).addTo(map).bindPopup(content);
                        }
                    });
                });
        }
        setInterval(updateBuses, 10000);
        updateBuses();
    </script>
</body>
</html>
