    <style>
        * {
            font-family: 'Inter', system-ui, sans-serif;
            box-sizing: border-box;
        }
        body { margin: 0; padding: 0; background: #111; }
        #map { height: 100vh; width: 100%; }

        /* GORNJA TRAŽILICA */
        .search-container {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: white;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.98);
            border: 1px solid rgba(0,0,0,0.08);
            padding-right: 6px;
            max-width: 340px;
        }
        .search-icon {
            padding: 10px 0 10px 16px;
            color: #ff6600;
            font-size: 14px;
        }
        .autocomplete-container {
            position: relative;
            flex: 1;
        }
        input {
            padding: 12px 12px 12px 0;
            width: 180px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            background: transparent;
            outline: none;
            color: #1a1a2e;
        }
        input::placeholder {
            color: #999;
            font-weight: 400;
            font-size: 13px;
        }
        .bus-count-badge {
            background: #ff6600;
            color: white;
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bus-count-badge i { font-size: 12px; }
        
        .autocomplete-list {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            background: white;
            border-radius: 20px;
            max-height: 320px;
            overflow-y: auto;
            z-index: 1001;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            border: 1px solid rgba(0,0,0,0.08);
            min-width: 280px;
        }
        .autocomplete-item {
            padding: 12px 18px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .autocomplete-item:active { background: #fff5ed; }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-gbr {
            font-weight: 700;
            color: #ff6600;
            background: #fff0e6;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .autocomplete-line { color: #666; font-size: 12px; margin-left: 8px; }

        /* GUMB ZA PRIKAZ STANICA - DOLJE CENTRIRANO */
        .control-panel {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: #1a1a2e;
            border-radius: 60px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .control-panel button {
            padding: 12px 28px;
            background: #ff6600;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }
        .control-panel button:active { background: #ff5500; transform: scale(0.97); }

        /* STATS - DOLJE DESNO */
        .stats {
            position: absolute;
            bottom: 20px;
            right: 16px;
            z-index: 1000;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            white-space: nowrap;
        }
        .stats i { font-size: 10px; opacity: 0.8; }

        /* IKONE AUTOBUSA - VEĆE I ČITLJIVE */
        .bus-label {
            width: 56px;
            height: 42px;
            border: 2.5px solid #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            background: white;
            transition: transform 0.1s ease;
        }
        .bus-label:active { transform: scale(0.95); }
        
        .bus-label-red {
            width: 56px;
            height: 42px;
            border: 2.5px solid #ff2200;
            border-radius: 10px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            background: #ff2200;
            transition: transform 0.1s ease;
        }
        .bus-label-red:active { transform: scale(0.95); }
        
        .bus-top {
            background: white;
            color: #ff6600;
            height: 21px;
            line-height: 21px;
            font-weight: 800;
            font-size: 13px;
            text-align: center;
        }
        .bus-label-red .bus-top {
            background: #ff2200;
            color: white;
            font-size: 13px;
        }
        .bus-bottom {
            background: #ffcc00;
            color: #1a1a2e;
            height: 21px;
            line-height: 21px;
            font-weight: 800;
            font-size: 12px;
            text-align: center;
        }
        .bus-bottom-red {
            background: #cc0000;
            color: white;
            height: 21px;
            line-height: 21px;
            font-weight: 800;
            font-size: 12px;
            text-align: center;
        }

        /* POPUP - TRAJNI, NE GASI SE */
        .custom-popup {
            font-family: 'Inter', sans-serif;
            min-width: 220px;
            padding: 4px 0;
        }
        .custom-popup .title {
            font-size: 16px;
            font-weight: 700;
            color: #ff6600;
            margin-bottom: 8px;
        }
        .custom-popup .row {
            padding: 3px 0;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
        }
        .custom-popup .row:last-child { border-bottom: none; }
        .custom-popup .label { color: #666; font-weight: 500; }
        .custom-popup .value { color: #1a1a2e; font-weight: 600; }
        .custom-popup .note {
            font-size: 11px;
            color: #888;
            font-style: italic;
            margin-top: 4px;
        }

        /* ZADNJI PUT VIĐEN - DESNI PANEL */
        .history-panel {
            position: absolute;
            top: 80px;
            right: 16px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            padding: 16px 18px;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
            min-width: 200px;
            max-width: 260px;
            border: 1px solid rgba(0,0,0,0.08);
            display: none;
        }
        .history-panel.visible { display: block; }
        .history-panel h4 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .history-panel h4 i { color: #ff6600; }
        .history-panel .close-btn {
            float: right;
            cursor: pointer;
            color: #999;
            font-size: 14px;
        }
        .history-panel .close-btn:hover { color: #ff6600; }
        .history-item {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item .gbr {
            font-weight: 700;
            color: #ff6600;
            background: #fff0e6;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 12px;
        }
        .history-item .time {
            color: #666;
            font-size: 11px;
        }
        .history-item .line {
            font-size: 11px;
            color: #1a1a2e;
            font-weight: 500;
        }
        .history-empty {
            color: #999;
            font-size: 12px;
            font-style: italic;
        }

        /* SCROLLBAR */
        .history-panel::-webkit-scrollbar { width: 4px; }
        .history-panel::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .history-panel::-webkit-scrollbar-thumb { background: #ff6600; border-radius: 10px; }
        .autocomplete-list::-webkit-scrollbar { width: 5px; }
        .autocomplete-list::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .autocomplete-list::-webkit-scrollbar-thumb { background: #ff6600; border-radius: 10px; }

        /* MOBITEL */
        @media (max-width: 768px) {
            .search-container { max-width: calc(100% - 32px); left: 16px; right: 16px; top: 12px; }
            input { width: 120px; font-size: 13px; }
            .bus-count-badge { padding: 4px 10px; font-size: 11px; }
            .control-panel button { padding: 10px 20px; font-size: 13px; }
            .history-panel { right: 8px; left: 8px; max-width: none; top: 72px; max-height: calc(100vh - 140px); }
            .bus-label, .bus-label-red { width: 48px; height: 38px; }
            .bus-top, .bus-label-red .bus-top { height: 19px; line-height: 19px; font-size: 12px; }
            .bus-bottom, .bus-bottom-red { height: 19px; line-height: 19px; font-size: 11px; }
            .autocomplete-list { min-width: auto; left: -10px; right: -10px; }

        }
        @media (max-width: 480px) {
            input { width: 80px; font-size: 12px; }
            .bus-label, .bus-label-red { width: 44px; height: 34px; }
            .bus-top, .bus-label-red .bus-top { height: 17px; line-height: 17px; font-size: 11px; }
            .bus-bottom, .bus-bottom-red { height: 17px; line-height: 17px; font-size: 10px; }
