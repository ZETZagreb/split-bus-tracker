<!DOCTYPE html>
<html>
<head>
    <title>Promet Split - Live Autobusi</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
        }
        
        body { margin: 0; padding: 0; background: #111; }
        #map { height: 100vh; width: 100%; }
        
        /* Gumb za prikaz stanica - uvijek vidljiv, odvojen od tražilice */
        .control-panel {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: #1a1a2e;
            border-radius: 60px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            overflow: hidden;
            backdrop-filter: blur(4px);
        }
        
        .control-panel button {
            padding: 12px 28px;
            background: #ff6600;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }
        
        .control-panel button i {
            font-size: 16px;
        }
        
        .control-panel button:active {
            background: #ff5500;
            transform: scale(0.97);
        }
        
        /* PRETRAGA - gore lijevo, ne smeta gumbu */
        .search-container {
            position: absolute; 
            top: 16px; 
            left: 16px;
            right: 16px;
            z-index: 1000; 
            background: white;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 0;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.98);
            border: 1px solid rgba(0,0,0,0.08);
            max-width: calc(100% - 32px);
        }
        
        .autocomplete-container {
            position: relative;
            flex: 1;
        }
        
        .search-icon {
            padding: 12px 0 12px 18px;
            color: #ff6600;
            font-size: 16px;
        }
        
        input { 
            padding: 14px 12px 14px 0;
            width: 100%;
            border: none;
            border-radius: 0;
            font-size: 15px;
            font-weight: 500;
            background: transparent;
            outline: none;
            color: #1a1a2e;
        }
        
        input::placeholder {
            color: #999;
            font-weight: 400;
        }
        
        .bus-count-badge {
            background: #ff6600;
            color: white;
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 700;
            margin-right: 6px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .bus-count-badge i {
            font-size: 13px;
        }
        
        .autocomplete-list {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            background: white;
            border-radius: 24px;
            max-height: 320px;
            overflow-y: auto;
            z-index: 1001;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            border: 1px solid rgba(0,0,0,0.08);
        }
        
        .autocomplete-item {
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .autocomplete-item:active {
            background-color: #fff5ed;
        }
        
        .autocomplete-gbr {
            font-weight: 700;
            color: #ff6600;
            background: #fff0e6;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .autocomplete-line {
            color: #666;
            font-size: 13px;
            margin-left: 8px;
        }
        
        /* Stats donji desni - mali */
        .stats {
            position: absolute;
            bottom: 20px;
            right: 16px;
            z-index: 1000;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            color: white;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            white-space: nowrap;
        }
        
        .stats i {
            font-size: 10px;
            opacity: 0.8;
        }
        
        /* IKONE AUTOBUSA - optimalne za mobitel i desktop */
        .bus-label {
            width: 56px;
            height: 42px;
            border: 2.5px solid #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            font-family: 'Inter', 'Arial Black', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.1s ease;
            background: white;
        }
        
        .bus-label:active {
            transform: scale(0.96);
        }
        
        .bus-label-red {
            width: 56px;
            height: 42px;
            border: 2.5px solid #ff2200;
            border-radius: 10px;
            overflow: hidden;
            font-family: 'Inter', 'Arial Black', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.1s ease;
            background: #ff2200;
        }
        
        .bus-label-red:active {
            transform: scale(0.96);
        }
        
        .bus-top {
            background: white;
            color: #ff6600;
            height: 21px;
            line-height: 21px;
            font-weight: 800;
            font-size: 13px;
            text-align: center;
        }
        
        .bus-label-red .bus-top {
            background: #ff2200;
            color: white;
            font-size: 13px;
        }
        
        .bus-bottom {
            background: #ffcc00;
            color: #1a1a2e;
            height: 21px;
            line-height: 21px;
            font-weight: 800;
            font-size: 12px;
            text-align: center;
        }
        
        .bus-bottom-red {
            background: #cc0000;
            color: white;
            height: 21px;
            line-height: 21px;
            font-weight: 800;
            font-size: 12px;
            text-align: center;
        }
        
        /* Scrollbar */
        .autocomplete-list::-webkit-scrollbar {
            width: 5px;
        }
        
        .autocomplete-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .autocomplete-list::-webkit-scrollbar-thumb {
            background: #ff6600;
            border-radius: 10px;
        }
        
        /* MOBITEL OPTIMIZACIJA */
        @media (max-width: 768px) {
            .control-panel {
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
            }
            
            .control-panel button {
                padding: 10px 24px;
                font-size: 14px;
            }
            
            .control-panel button i {
                font-size: 14px;
            }
            
            .search-container {
                top: 12px;
                left: 12px;
                right: 12px;
                max-width: calc(100% - 24px);
            }
            
            .search-icon {
                padding: 10px 0 10px 14px;
                font-size: 14px;
            }
            
            input {
                padding: 12px 10px 12px 0;
                font-size: 14px;
            }
            
            .bus-count-badge {
                padding: 6px 12px;
                font-size: 12px;
                margin-right: 4px;
            }
            
            .bus-count-badge i {
                font-size: 11px;
            }
            
            .bus-count-badge span {
                font-size: 12px;
            }
            
            .autocomplete-item {
                padding: 12px 14px;
            }
            
            .bus-label, .bus-label-red {
                width: 52px;
                height: 40px;
            }
            
            .bus-top, .bus-label-red .bus-top {
                height: 20px;
                line-height: 20px;
                font-size: 12px;
            }
            
            .bus-bottom, .bus-bottom-red {
                height: 20px;
                line-height: 20px;
                font-size: 11px;
            }
            
            .stats {
                bottom: 12px;
                right: 12px;
                padding: 6px 10px;
                font-size: 10px;
            }
        }
        
        @media (max-width: 480px) {
            .control-panel button {
                padding: 9px 20px;
                font-size: 13px;
            }
            
            .bus-count-badge span {
                font-size: 11px;
            }
            
            .bus-label, .bus-label-red {
                width: 48px;
                height: 38px;
            }
            
            .bus-top, .bus-label-red .bus-top {
                height: 19px;
                line-height: 19px;
                font-size: 11px;
            }
            
            .bus-bottom, .bus-bottom-red {
                height: 19px;
                line-height: 19px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
<div class="control-panel">
    <button id="toggleStopsBtn">
        <i class="fas fa-map-marker-alt"></i>
        <span>Prikaži stanice</span>
    </button>
</div>
<div class="search-container">
    <div class="search-icon">
        <i class="fas fa-search"></i>
    </div>
    <div class="autocomplete-container">
        <input type="text" id="busSearch" placeholder="Garažni broj ili linija..." autocomplete="off">
        <div id="suggestionsList" class="autocomplete-list" style="display: none;"></div>
    </div>
    <div class="bus-count-badge">
        <i class="fas fa-bus"></i>
        <span id="busCount">0</span>
    </div>
</div>
<div class="stats">
    <i class="fas fa-clock"></i>
    <span id="statsText">Učitavanje...</span>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([43.51, 16.44], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
    }).addTo(map);
    
    var markers = {};
    var allStops = [];
    var stopMarkers = [];
    var stopsVisible = false;
    
    // Funkcija za kreiranje ikone - CRVENA za garažne 307 i 308
    function createBusIcon(lineName, garageNumber) {
        var specialGarageNumbers = ['307', '308', 307, 308];
        var isSpecial = specialGarageNumbers.includes(String(garageNumber).trim());
        
        var html = '';
        
        if (isSpecial) {
            html = `<div class="bus-label-red">
                        <div class="bus-top">${lineName}</div>
                        <div class="bus-bottom-red">${garageNumber}</div>
                    </div>`;
        } else {
            html = `<div class="bus-label">
                        <div class="bus-top">${lineName}</div>
                        <div class="bus-bottom">${garageNumber}</div>
                    </div>`;
        }
        
        return L.divIcon({ 
            html: html,
            className: '', 
            iconSize: [56, 42], 
            iconAnchor: [28, 21]
        });
    }
    
    function loadStops() {
        fetch('stops.json')
            .then(response => response.json())
            .then(stops => {
                allStops = stops;
                console.log(`Učitano ${stops.length} stanica`);
            })
            .catch(err => {
                console.error('Greška pri učitavanju stanica:', err);
            });
    }
    
    function addStopsToMap() {
        if (stopMarkers.length > 0) return;
        
        allStops.forEach(stop => {
            var lat = stop.geography.coordinates[1];
            var lng = stop.geography.coordinates[0];
            var routes = stop.routes ? stop.routes.map(r => r.name).join(', ') : '';
            
            var marker = L.circleMarker([lat, lng], {
                radius: 5,
                fillColor: "#3388ff",
                color: "#fff",
                weight: 1.5,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map);
            
            marker.bindPopup(`<b>${stop.name}</b><br><b>Linije:</b> ${routes || 'Nema'}`);
            stopMarkers.push(marker);
        });
    }
    
    function removeStopsFromMap() {
        stopMarkers.forEach(marker => {
            map.removeLayer(marker);
        });
        stopMarkers = [];
    }
    
    function toggleStops() {
        stopsVisible = !stopsVisible;
        if (stopsVisible) {
            addStopsToMap();
            document.getElementById('toggleStopsBtn').innerHTML = '<i class="fas fa-map-marker-alt"></i><span>Sakrij stanice</span>';
        } else {
            removeStopsFromMap();
            document.getElementById('toggleStopsBtn').innerHTML = '<i class="fas fa-map-marker-alt"></i><span>Prikaži stanice</span>';
        }
    }
    
    function fetchBusDetails(garageNumber, marker, bus) {
        var timestamp = Date.now();
        var url = `https://www.bus-split.com/api/vehicles/details?id=${garageNumber}&t=${timestamp}`;
        
        fetch(url)
            .then(response => response.json())
            .then(data => {
                var popupContent = `
                    <div style="font-family: 'Inter', sans-serif; min-width: 200px; padding: 4px 0;">
                        <b style="color: #ff6600; font-size: 15px;">🚌 Linija ${data.name || bus.name}</b><br><br>
                        <b>🔢 Garažni broj:</b> ${garageNumber}<br>
                        <b>📋 Registarska oznaka:</b> ${data.registrationNumber || bus.registrationNumber || 'Nepoznato'}<br>
                        <b>🏭 Marka vozila:</b> ${data.brand || bus.brand || 'Nepoznato'}
                    </div>
                `;
                marker.bindPopup(popupContent).openPopup();
            })
            .catch(error => {
                console.error("Greška:", error);
                var popupContent = `
                    <div style="font-family: 'Inter', sans-serif; min-width: 200px; padding: 4px 0;">
                        <b style="color: #ff6600; font-size: 15px;">🚌 Linija ${bus.name}</b><br><br>
                        <b>🔢 Garažni broj:</b> ${garageNumber}<br>
                        <b>📋 Registarska oznaka:</b> ${bus.registrationNumber || 'Nepoznato'}<br>
                        <b>🏭 Marka vozila:</b> ${bus.brand || 'Nepoznato'}
                    </div>
                `;
                marker.bindPopup(popupContent).openPopup();
            });
    }
    
    async function fetchLiveBuses() {
        try {
            var response = await fetch(`https://www.bus-split.com/api/vehicles/live?t=${Date.now()}`);
            var data = await response.json();
            var vehicles = data.vehicles;
            var currentGbrs = vehicles.map(v => v.garageNumber);
            
            vehicles.forEach(bus => {
                var icon = createBusIcon(bus.name, bus.garageNumber);
                
                if (markers[bus.garageNumber]) {
                    markers[bus.garageNumber].setLatLng([bus.latitude, bus.longitude]);
                    var newIcon = createBusIcon(bus.name, bus.garageNumber);
                    markers[bus.garageNumber].setIcon(newIcon);
                } else {
                    var marker = L.marker([bus.latitude, bus.longitude], {icon: icon}).addTo(map);
                    marker.on('click', () => fetchBusDetails(bus.garageNumber, marker, bus));
                    markers[bus.garageNumber] = marker;
                }
                
                markers[bus.garageNumber].bindPopup(`
                    <div style="font-family: 'Inter', sans-serif; padding: 4px 0;">
                        <b style="color: #ff6600; font-size: 15px;">🚌 Linija ${bus.name}</b><br>
                        <b>🔢 Garažni broj:</b> ${bus.garageNumber}<br>
                        <i style="font-size: 12px;">Kliknite za više detalja...</i>
                    </div>
                `);
            });
            
            for (var gbr in markers) { 
                if (!currentGbrs.includes(String(gbr))) { 
                    map.removeLayer(markers[gbr]); 
                    delete markers[gbr]; 
                } 
            }
            
            var vehicleCount = Object.keys(markers).length;
            document.getElementById('statsText').innerHTML = `${new Date().toLocaleTimeString('hr-HR')} | ${vehicleCount}`;
            document.getElementById('busCount').innerHTML = `${vehicleCount}`;
        } catch (error) {
            console.error("Greška:", error);
            document.getElementById('statsText').innerHTML = 'Greška';
        }
    }
    
    function filterBuses() {
        var val = document.getElementById('busSearch').value.toLowerCase();
        var brojac = 0;
        for (var gbr in markers) {
            var popup = markers[gbr].getPopup().getContent();
            if (typeof popup === 'string' && popup.toLowerCase().includes(val)) {
                markers[gbr].setOpacity(1);
                brojac++;
            } else {
                markers[gbr].setOpacity(0.25);
            }
        }
        document.getElementById('busCount').innerHTML = `${brojac}`;
    }
    
    function showSuggestions() {
        var val = document.getElementById('busSearch').value.toLowerCase().trim();
        var div = document.getElementById('suggestionsList');
        if (val.length < 1) { div.style.display = 'none'; return; }
        
        var suggestions = [];
        for (var gbr in markers) {
            var popup = markers[gbr].getPopup().getContent();
            var gbrMatch = popup.match(/Garažni broj: (\d+)/);
            var lineMatch = popup.match(/Linija (\d+[A-Z]?)/);
            if (gbrMatch && (gbrMatch[1].includes(val) || (lineMatch && lineMatch[1].includes(val)))) {
                suggestions.push({ gbr: gbrMatch[1], line: lineMatch ? lineMatch[1] : '', marker: markers[gbr] });
            }
        }
        
        if (allStops.length > 0 && stopsVisible) {
            allStops.forEach(stop => {
                if (stop.name.toLowerCase().includes(val)) {
                    suggestions.push({ type: 'stop', name: stop.name, stop: stop });
                }
            });
        }
        
        var unique = [];
        var seen = {};
        for (var i = 0; i < suggestions.length; i++) {
            var key = suggestions[i].gbr || suggestions[i].name;
            if (!seen[key]) {
                seen[key] = true;
                unique.push(suggestions[i]);
            }
        }
        
        if (unique.length > 0) {
            div.innerHTML = '';
            unique.slice(0, 10).forEach(item => {
                var d = document.createElement('div');
                d.className = 'autocomplete-item';
                if (item.gbr) {
                    d.innerHTML = `<span class="autocomplete-gbr"><i class="fas fa-bus"></i> ${item.gbr}</span><span class="autocomplete-line">Linija ${item.line}</span>`;
                    d.onclick = () => {
                        document.getElementById('busSearch').value = item.gbr;
                        div.style.display = 'none';
                        if (item.marker) {
                            map.setView(item.marker.getLatLng(), 16);
                            item.marker.openPopup();
                            filterBuses();
                        }
                    };
                } else {
                    d.innerHTML = `<span class="autocomplete-gbr"><i class="fas fa-map-pin"></i> ${item.name}</span>`;
                    d.onclick = () => {
                        document.getElementById('busSearch').value = item.name;
                        div.style.display = 'none';
                        var lat = item.stop.geography.coordinates[1];
                        var lng = item.stop.geography.coordinates[0];
                        map.setView([lat, lng], 16);
                    };
                }
                div.appendChild(d);
            });
            div.style.display = 'block';
        } else {
            div.style.display = 'none';
        }
    }
    
    document.getElementById('toggleStopsBtn').onclick = toggleStops;
    document.getElementById('busSearch').addEventListener('keyup', showSuggestions);
    document.addEventListener('click', e => {
        var c = document.querySelector('.autocomplete-container');
        if (c && !c.contains(e.target)) {
            document.getElementById('suggestionsList').style.display = 'none';
        }
    });
    
    loadStops();
    fetchLiveBuses();
    setInterval(fetchLiveBuses, 5000);
</script>
</body>
</html>
